<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lithosky</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="Landscape view. Drag to orbit, Shift-drag to pan, scroll to zoom, W A S D to move."></canvas>

  <header class="bar">
    <span class="brand">lithosky</span>
    <input id="title" class="title" aria-label="Scene title" maxlength="80" spellcheck="false">
    <nav class="actions" aria-label="File">
      <button type="button" id="new-scene">New</button>
      <button type="button" id="open-scene">Open…</button>
      <button type="button" id="save-scene">Save</button>
      <button type="button" id="export-image" class="primary">Export image</button>
    </nav>
    <nav class="actions" aria-label="History">
      <button type="button" id="undo" aria-keyshortcuts="Meta+Z Control+Z">Undo</button>
      <button type="button" id="redo" aria-keyshortcuts="Meta+Shift+Z Control+Shift+Z">Redo</button>
    </nav>
    <output id="status" class="status" aria-live="polite">Starting WebGPU…</output>
    <button type="button" id="toggle-panel" class="panel-toggle" aria-controls="panel" aria-expanded="true">Controls</button>
  </header>

  <aside id="panel" class="panel" aria-label="Scene controls"></aside>

  <p class="hint">Drag to orbit · Shift-drag to pan · Scroll to zoom · W A S D to move</p>
  <p id="message" class="message" role="alert" hidden></p>

  <section id="recovery" class="recovery" hidden aria-label="Recovered work">
    <p>Lithosky found unsaved work from <span id="recovery-time"></span>.</p>
    <button type="button" id="restore-recovery" class="primary">Restore it</button>
    <button type="button" id="dismiss-recovery">Start fresh</button>
  </section>

  <dialog id="export-dialog" class="dialog">
    <form method="dialog">
      <h2>Export image</h2>
      <label>Size
        <select id="export-size">
          <option value="1920">1920 px</option>
          <option value="2560" selected>2560 px</option>
          <option value="3840">3840 px (4K)</option>
        </select>
      </label>
      <label>Quality
        <select id="export-samples">
          <option value="64">Draft · 64 samples</option>
          <option value="256" selected>Good · 256 samples</option>
          <option value="1024">Final · 1024 samples</option>
        </select>
      </label>
      <progress id="export-progress" max="1" value="0" hidden></progress>
      <div class="dialog-actions">
        <button value="cancel" id="export-cancel">Cancel</button>
        <button type="button" id="export-start" class="primary">Render and save</button>
      </div>
    </form>
  </dialog>

  <input id="scene-file" type="file" accept=".lithosky,application/json,application/zip" hidden>
  <input id="heightmap-file" type="file" accept=".png,.heightmap,application/zip" hidden>
</body>
</html>
