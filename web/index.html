<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lithosky</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="Landscape view. Drag to orbit, Shift-drag to pan, scroll to zoom, W A S D to move."></canvas>

  <header class="bar chrome">
    <span class="brand" id="brand">lithosky</span>
    <input id="title" class="title" aria-label="Scene title" maxlength="80" spellcheck="false">
    <output id="status" class="status" aria-live="polite">Starting WebGPU…</output>
    <div class="bar-actions">
      <span id="history-buttons" class="button-group"></span>
      <div class="menu">
        <button type="button" id="file-menu" class="menu-button" aria-haspopup="menu" aria-expanded="false" aria-controls="file-items">File</button>
        <div id="file-items" class="menu-items" role="menu" hidden>
          <button type="button" role="menuitem" id="new-scene">New scene</button>
          <button type="button" role="menuitem" id="open-scene">Open…</button>
          <button type="button" role="menuitem" id="save-scene">Save<kbd>⌘S</kbd></button>
        </div>
      </div>
      <span id="help-button-slot"></span>
      <button type="button" id="render" class="primary render-button">Render</button>
    </div>
  </header>

  <nav id="rail" class="rail chrome" aria-label="Labs"></nav>

  <aside id="drawer" class="drawer chrome" aria-labelledby="drawer-title" hidden>
    <header class="drawer-head">
      <h2 id="drawer-title"></h2>
      <span id="drawer-close-slot"></span>
    </header>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <section id="help" class="popover help" aria-label="Help" hidden>
    <h2>Moving around</h2>
    <dl>
      <dt>Drag</dt><dd>Orbit</dd>
      <dt>Shift-drag or right-drag</dt><dd>Pan</dd>
      <dt>Scroll</dt><dd>Zoom</dd>
      <dt>W A S D, Q E</dt><dd>Fly</dd>
    </dl>
    <h2>Shortcuts</h2>
    <dl>
      <dt>1 – 7</dt><dd>Open a lab</dd>
      <dt>Esc</dt><dd>Close the lab</dd>
      <dt>H</dt><dd>Hide or show the interface</dd>
      <dt>⌘Z, ⇧⌘Z</dt><dd>Undo, redo</dd>
      <dt>⌘S</dt><dd>Save</dd>
    </dl>
  </section>

  <p id="message" class="message" role="alert" hidden></p>

  <section id="recovery" class="recovery" hidden aria-label="Recovered work">
    <p>Lithosky found unsaved work from <span id="recovery-time"></span>.</p>
    <button type="button" id="restore-recovery" class="primary">Restore it</button>
    <button type="button" id="dismiss-recovery">Start fresh</button>
  </section>

  <dialog id="export-dialog" class="dialog">
    <form method="dialog">
      <h2>Render image</h2>
      <div class="field">
        <span class="field-name" id="export-size-name">Size</span>
        <div class="segmented" role="radiogroup" aria-labelledby="export-size-name">
          <label><input type="radio" name="export-size" value="1920"><span>1920 px</span></label>
          <label><input type="radio" name="export-size" value="2560" checked><span>2560 px</span></label>
          <label><input type="radio" name="export-size" value="3840"><span>4K</span></label>
        </div>
      </div>
      <div class="field">
        <span class="field-name" id="export-samples-name">Quality</span>
        <div class="segmented" role="radiogroup" aria-labelledby="export-samples-name">
          <label><input type="radio" name="export-samples" value="64"><span>Draft</span></label>
          <label><input type="radio" name="export-samples" value="256" checked><span>Good</span></label>
          <label><input type="radio" name="export-samples" value="1024"><span>Final</span></label>
        </div>
      </div>
      <progress id="export-progress" max="1" value="0" hidden></progress>
      <div class="dialog-actions">
        <button value="cancel" id="export-cancel">Cancel</button>
        <button type="button" id="export-start" class="primary">Render and save PNG</button>
      </div>
    </form>
  </dialog>

  <input id="scene-file" type="file" accept=".lithosky,application/json,application/zip" hidden>
  <input id="heightmap-file" type="file" accept=".png,.heightmap,application/zip" hidden>
</body>
</html>
