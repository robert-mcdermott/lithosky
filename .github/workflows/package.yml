name: Package development or release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (no v prefix)
        required: true
        default: 0.1.0-dev.4
permissions:
  contents: read
jobs:
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test -json ./... > smoke.json
        shell: bash
      - run: go vet ./...
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ matrix.os }}
          path: smoke.json
  package:
    needs: native-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build archives with notices and checksums
        env:
          LITHOSKY_PACKAGE_VERSION: ${{ inputs.version }}
        run: go run ./tools/release --version "$LITHOSKY_PACKAGE_VERSION" --out dist/releases
      - run: go run ./tools/release --verify dist/releases
      - run: npm run site
      - uses: actions/upload-artifact@v4
        with:
          name: lithosky-packages
          path: dist/releases/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lithosky-product-site
          path: dist/site/
          include-hidden-files: true
          if-no-files-found: error
