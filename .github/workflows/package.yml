name: Package a development build
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (no v prefix), such as 0.6.0-dev.1
        required: true
        default: 0.6.0-dev.1
permissions:
  contents: read
jobs:
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test -json ./... > smoke.json
        shell: bash
      - run: go vet ./...
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ matrix.os }}
          path: smoke.json
  package:
    needs: native-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the executables and SHA256SUMS
        env:
          LITHOSKY_PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          go run ./tools/release --version "$LITHOSKY_PACKAGE_VERSION" --out dist/releases
          go run ./tools/release --verify dist/releases --version "$LITHOSKY_PACKAGE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: lithosky-packages
          path: dist/releases/*
          if-no-files-found: error
