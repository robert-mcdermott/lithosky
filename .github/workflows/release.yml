name: Release

# Pushing a tag such as v0.6.0 builds the six executables and SHA256SUMS and attaches them,
# with the release notes, to a draft release. Review the draft, then publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and draft the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The tag matches the version
        run: |
          version="$(sed -n 's/^var version = "\(.*\)"$/\1/p' main.go)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME and main.go $version must agree."
            exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          go vet ./...
          go test ./...
          npm test
      - name: Build and verify
        run: |
          go run ./tools/release --version "$VERSION" --out dist
          go run ./tools/release --verify dist --version "$VERSION"
          cat dist/SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes for this version if there are any, else its changelog section.
          if [ -f "docs/release-notes/$VERSION.md" ]; then
            tail -n +2 "docs/release-notes/$VERSION.md" > notes.md
          else
            awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > notes.md
          fi
          cat >> notes.md <<NOTES

          ## Install

          macOS and Linux:

          \`\`\`sh
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh
          \`\`\`

          Windows (PowerShell):

          \`\`\`powershell
          irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.ps1 | iex
          \`\`\`

          The installers check each download against \`SHA256SUMS\` before installing. To
          download by hand, pick the file for your system below and see
          [Installing](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/INSTALLING.md).
          NOTES
          sed -i 's/^          //' notes.md
          # Relative links point into the repository; on a release page they become links to
          # the tagged files.
          sed -i -E "s#\]\(([^):#]+)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)#g" notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft $prerelease --title "Lithosky $VERSION" --notes-file notes.md
          fi
